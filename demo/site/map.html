<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b12">
<title>Map — Two days in Lisbon</title><meta name="description" content="Every place on one map.">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚋</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body>
<div class="hero"><div class="wrap"><h1>Map.</h1><p class="lead">Pins marked <i>approx</i> were inferred rather than sourced: good enough to walk toward, not good enough to argue with a driver about. Faded pins are currently shut.</p></div></div>
<div class="wrap">
<div class="chips" id="mf"><button class="chip" data-f="all" aria-pressed="true">Everything</button><button class="chip" data-f="open" aria-pressed="false">Open now</button><button class="chip" data-f="bar" aria-pressed="false">Bar</button><button class="chip" data-f="cafe" aria-pressed="false">Cafe</button><button class="chip" data-f="do" aria-pressed="false">Do</button><button class="chip" data-f="food" aria-pressed="false">Food</button><button class="chip" data-f="museum" aria-pressed="false">Museum</button><button class="chip" data-f="park" aria-pressed="false">Park</button><button class="chip" data-f="practical" aria-pressed="false">Practical</button><button class="chip" data-f="shop" aria-pressed="false">Shop</button><button class="chip" data-f="street" aria-pressed="false">Street</button><button class="chip" data-f="sweet" aria-pressed="false">Sweet</button><button class="chip" data-f="temple" aria-pressed="false">Temple</button><button class="chip" data-f="view" aria-pressed="false">View</button></div><div id="map"></div><div id="legend" class="card flat"></div></div>
<script src="assets/data.js"></script><script src="assets/core.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PAL=["#ffc857","#6ee7d0","#ff7ab8","#8ab8ff","#b98cff","#ff8a4c","#7ee0a8","#ff5f6d","#a99fc4"];
const CATS=[...new Set(DATA.places.map(p=>p.cat))].sort();
const COL={}; CATS.forEach((c,i)=>COL[c]=PAL[i%PAL.length]);
const pts=DATA.places.filter(p=>p.lat&&p.lng);
const map=L.map("map",{scrollWheelZoom:false});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
if(pts.length) map.fitBounds(pts.map(p=>[p.lat,p.lng]),{padding:[28,28],maxZoom:15});
else map.setView([0,0],2);
let ms=[];
function draw(f){
  ms.forEach(m=>map.removeLayer(m)); ms=[];
  const t=localMins(); let l=pts;
  if(f==="open") l=l.filter(p=>["open","closing"].indexOf(openState(p,t).state)>=0);
  else if(f!=="all") l=l.filter(p=>p.cat===f);
  l.forEach(p=>{
    const st=openState(p,t), c=COL[p.cat]||"#a99fc4", dim=st.state==="shut";
    ms.push(L.circleMarker([p.lat,p.lng],{radius:dim?5:8,color:c,fillColor:c,
      fillOpacity:dim?.25:.85,weight:dim?1:2})
     .bindPopup('<b>'+p.name+'</b><br><span style="color:#a99fc4">'+price(p)+' · '+st.label+'</span><br>'+
       '<a href="'+LINK.map(p)+'" target="_blank" rel="noopener">Maps</a> · '+
       '<a href="'+LINK.walk(p)+'" target="_blank" rel="noopener">Walk</a> · '+
       '<a href="'+LINK.uber(p)+'" target="_blank" rel="noopener">Ride</a>').addTo(map));
  });
  document.getElementById("legend").innerHTML="<p class='tiny' style='margin:0'>Showing <b>"+
    l.length+"</b> of "+pts.length+" mapped places. "+
    CATS.map(k=>'<span style="color:'+COL[k]+'">■ '+k+'</span>').join(" &nbsp; ")+"</p>";
}
document.querySelectorAll("#mf .chip").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#mf .chip").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true");draw(b.dataset.f);});
draw("all");
</script>
<script>mountChrome("map.html");</script>
</body></html>
