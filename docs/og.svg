<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1d3f"/><stop offset="0.55" stop-color="#1a1224"/>
      <stop offset="1" stop-color="#0d0b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#ff8a4c" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(84,92)">
    <circle cx="46" cy="46" r="42" fill="none" stroke="#2c2438" stroke-width="7"/>
    <path d="M46 46 L46 16" stroke="#ffc857" stroke-width="8" stroke-linecap="round"/>
    <path d="M46 46 L68 58" stroke="#ff8a4c" stroke-width="8" stroke-linecap="round"/>
    <circle cx="46" cy="46" r="6" fill="#ff8a4c"/>
  </g>

  <text x="84" y="292" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="82" font-weight="800" fill="#f4eeff" letter-spacing="-3">A travel guide that</text>
  <text x="84" y="380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="82" font-weight="800" fill="#ff8a4c" letter-spacing="-3">reads the clock.</text>

  <text x="84" y="452" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="31" fill="#a99fc4">It is 3pm and you leave at 7. What is open, and what still fits?</text>

  <g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700">
    <rect x="84"  y="500" width="196" height="52" rx="26" fill="#171319" stroke="#2c2438"/>
    <text x="182" y="533" fill="#7ee0a8" text-anchor="middle">No install</text>
    <rect x="296" y="500" width="196" height="52" rx="26" fill="#171319" stroke="#2c2438"/>
    <text x="394" y="533" fill="#7ee0a8" text-anchor="middle">No account</text>
    <rect x="508" y="500" width="160" height="52" rx="26" fill="#171319" stroke="#2c2438"/>
    <text x="588" y="533" fill="#7ee0a8" text-anchor="middle">No AI</text>
    <rect x="684" y="500" width="252" height="52" rx="26" fill="#171319" stroke="#2c2438"/>
    <text x="810" y="533" fill="#8ab8ff" text-anchor="middle">Works offline</text>
  </g>

  <text x="1116" y="576" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="24" fill="#776e91" text-anchor="end">OpenStreetMap and Wikivoyage</text>
</svg>
